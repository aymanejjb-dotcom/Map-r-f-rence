<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niche Perfumery Atlas</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator_simple.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f7f4ef; --panel: #ffffff; --ink: #1f1b16; --muted: #6f665b; --line: #e4ddd2;
  --accent: #8a6a3b;
  --niche: #7b2d5b; --concept: #2f6f6a; --dept: #b8862f;
  --s-nc: #a59c90; --s-sample: #3d6fb4; --s-meet: #c27a12; --s-partner: #2e8a4f; --s-declined: #b23a3a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15130f; --panel: #1e1b17; --ink: #efe9df; --muted: #a59c90; --line: #332e27;
    --accent: #d1ad72; --niche: #c46a9e; --concept: #5fb3ab; --dept: #e0b25a;
  --s-nc: #6f665b; --s-sample: #6f9fe0; --s-meet: #e3a043; --s-partner: #5cc27f; --s-declined: #e06a6a;
  }
}
:root[data-theme="dark"] {
  --bg: #15130f; --panel: #1e1b17; --ink: #efe9df; --muted: #a59c90; --line: #332e27;
  --accent: #d1ad72; --niche: #c46a9e; --concept: #5fb3ab; --dept: #e0b25a;
  --s-nc: #6f665b; --s-sample: #6f9fe0; --s-meet: #e3a043; --s-partner: #5cc27f; --s-declined: #e06a6a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 Inter, system-ui, sans-serif; display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; padding: 12px 16px 6px; }
h1 { font: 600 26px/1.1 "Cormorant Garamond", Georgia, serif; margin: 0; letter-spacing: .2px; }
.sub { color: var(--muted); font-size: 13px; }
/* Pipeline dashboard */
.dash { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 6px 16px 8px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.tile .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.tile b { font: 600 26px/1.15 "Cormorant Garamond", Georgia, serif; }
.tile b small { font: 500 13px Inter, system-ui, sans-serif; color: var(--muted); }
.tile .hint { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.funnel { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--line); margin-top: 4px; gap: 1px; }
.funnel i { display: block; }
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; }
.st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; }
.pri { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 4px; padding: 1px 6px; border: 1px solid var(--line); }
.pri.t1 { color: var(--niche); border-color: currentColor; }
.pri.t2 { color: var(--concept); border-color: currentColor; }
.pri.t3 { color: var(--muted); }
.tabulator-cell.editable { cursor: text; }
.tabulator-cell.editable:hover { box-shadow: inset 0 0 0 1px var(--accent); }
.note { color: var(--muted); }
.actions { display: flex; gap: 6px; margin-left: auto; align-self: end; flex-wrap: wrap; }
button.primary { font: inherit; border: 1px solid var(--accent); background: var(--accent); color: var(--panel); border-radius: 6px; padding: 6px 10px; cursor: pointer; font-weight: 600; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: end; padding: 8px 16px 10px; border-bottom: 1px solid var(--line); }
.f { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.f select, .f input[type=search] { font: inherit; text-transform: none; letter-spacing: 0; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 120px; }
.f input[type=search] { min-width: 200px; }
.f input[type=range] { width: 130px; accent-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { white-space: nowrap; text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--ink); border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 10px; cursor: pointer; user-select: none; }
.chip input { display: none; }
.chip:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 15%, var(--panel)); }
button.reset { font: inherit; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
main { flex: 1; display: grid; grid-template-rows: minmax(260px, 52%) 1fr; min-height: 0; }
#map { min-height: 260px; border-bottom: 1px solid var(--line); }
#table { min-height: 0; }
.legend { background: var(--panel); color: var(--ink); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); font-size: 12px; line-height: 1.7; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.leaflet-popup-content { margin: 12px 14px; font: 13px/1.45 Inter, system-ui, sans-serif; }
.pop h3 { margin: 0 0 2px; font: 600 18px/1.15 "Cormorant Garamond", Georgia, serif; }
.pop .meta { color: #6f665b; font-size: 12px; margin-bottom: 6px; }
.pop .scores { display: flex; gap: 10px; margin: 6px 0; font-size: 12px; }
.pop .tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
.pop .tag { background: #f1ebe1; border-radius: 4px; padding: 1px 6px; font-size: 11px; }
.pop a { color: #8a6a3b; font-weight: 600; margin-right: 10px; }
/* Tabulator theme */
.tabulator { background: var(--panel); border: 0; font-size: 13px; color: var(--ink); }
.tabulator .tabulator-header { background: var(--panel); color: var(--muted); border-bottom: 1px solid var(--line); }
.tabulator .tabulator-header .tabulator-col { background: var(--panel); border-right: 0; }
.tabulator .tabulator-tableholder .tabulator-table { background: var(--panel); color: var(--ink); }
.tabulator-row { background: var(--panel); border-bottom: 1px solid var(--line); }
.tabulator-row.tabulator-row-even { background: color-mix(in srgb, var(--panel) 94%, var(--ink)); }
.tabulator-row.tabulator-selectable:hover { background: color-mix(in srgb, var(--accent) 12%, var(--panel)); cursor: pointer; }
.tabulator-row.active { background: color-mix(in srgb, var(--accent) 24%, var(--panel)) !important; }
.tabulator .tabulator-footer { background: var(--panel); color: var(--muted); border-top: 1px solid var(--line); }
.bar { height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
.typ { font-size: 12px; white-space: nowrap; }
.tabulator a { color: var(--accent); }
@media (max-width: 700px) {
  .dash { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .actions { margin-left: 0; }
  .f input[type=search] { min-width: 0; width: 100%; }
  .f.search { width: 100%; }
  main { grid-template-rows: 300px 1fr; }
}
</style>
</head>
<body>
<header>
  <h1>Niche Perfumery Atlas</h1>
  <span class="sub">BE · NL · DE · FR · LU · CH — niche boutiques, concept stores & department stores</span>
</header>
<section class="dash" aria-label="Pipeline metrics">
  <div class="tile"><span class="lbl">Total target stores</span><b id="m-total">0</b><span class="hint" id="m-total-h"></span></div>
  <div class="tile"><span class="lbl">High-priority targets</span><b id="m-high">0</b><span class="hint" id="m-high-h"></span></div>
  <div class="tile"><span class="lbl">Active pipeline</span><b id="m-pipe">0</b><span class="hint" id="m-pipe-h"></span><div class="funnel" id="m-funnel"></div></div>
  <div class="tile"><span class="lbl">Est. address confidence</span><b id="m-addr">–</b><span class="hint" id="m-addr-h"></span></div>
</section>
<section class="filters">
  <label class="f search">Search<input id="q" type="search" placeholder="Name, city, street, network…"></label>
  <div class="f">Country<div class="chips" id="countries"></div></div>
  <label class="f">City<select id="city"><option value="">All</option></select></label>
  <label class="f">Type<select id="type"><option value="">All</option></select></label>
  <label class="f">Min tier <span id="tier-v">0</span><input id="tier" type="range" min="0" max="100" step="5" value="0"></label>
  <label class="f">Min alignment <span id="align-v">0</span><input id="align" type="range" min="0" max="100" step="5" value="0"></label>
  <div class="f">Single-SKU openness
    <div class="chips">
      <label class="chip"><input type="checkbox" name="open" value="High" checked>High</label>
      <label class="chip"><input type="checkbox" name="open" value="Med" checked>Med</label>
      <label class="chip"><input type="checkbox" name="open" value="Low" checked>Low</label>
    </div>
  </div>
  <div class="f">Source
    <div class="chips">
      <label class="chip"><input type="checkbox" name="src" value="curated" checked>Curated</label>
      <label class="chip"><input type="checkbox" name="src" value="osm" checked>OSM</label>
    </div>
  </div>
  <label class="f">Pipeline status<select id="status"><option value="">All</option></select></label>
  <label class="f">Launch priority<select id="priority"><option value="">All</option></select></label>
  <div class="f">Focus<span class="chips"><label class="chip" title="Tier 1 indie niche, High single-SKU openness, fit ≥ 70, not yet won or declined"><input id="quick" type="checkbox">High-Priority Quick Wins</label></span></div>
  <label class="f">Map sync<span class="chips"><label class="chip"><input id="inview" type="checkbox">Only in view</label></span></label>
  <div class="actions">
    <button class="primary" id="csv" title="Download the rows currently shown, in table order">Export CSV</button>
    <button class="reset" id="crm" title="Save as sources/crm.json, then run build_perfumeries.py to bake edits into the dataset">Export CRM JSON</button>
    <button class="reset" id="discard" title="Forget pipeline edits stored in this browser">Discard edits</button>
    <button class="reset" id="reset">Reset filters</button>
  </div>
</section>
<main>
  <div id="map"></div>
  <div id="table"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
<script src="perfumeries.js"></script>
<script>
(async function () {
  let data = window.PERFUMERIES;
  if (!data) {
    try { data = await (await fetch("perfumeries.json")).json(); } catch (e) { data = []; }
  }

  const css = getComputedStyle(document.documentElement);
  const color = t => css.getPropertyValue(
    t === "Niche Boutique" ? "--niche" : t === "Independent Concept Store" ? "--concept" : "--dept").trim();
  const radius = tier => 4 + Math.max(0, tier - 50) / 4;   // 4px @ ≤50 → 16.5px @ 100
  const stars = v => v == null ? "–" : v.toFixed(1) + "★";
  // Lower-cased search haystack built once, so typing never re-joins 300+ records
  data.forEach(r => { r._q = [r.name, r.city, r.district || "", r.country_name, r.full_address, r.type, r.network || "", r.sentiment_summary, ...r.cx_traits].join(" ").toLowerCase(); });
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---- CRM: pipeline edits live in this browser until exported to sources/crm.json
  const STATUSES = ["Not Contacted", "Sample Sent", "Meeting Booked", "Partner Active", "Declined"];
  const ACTIVE = new Set(["Sample Sent", "Meeting Booked", "Partner Active"]);
  const ROLES = ["Founder", "Store Manager", "Head Buyer"];
  const CRM_FIELDS = ["pipeline_status", "decision_maker_role", "notes_prospections"];
  const STORE_KEY = "perfumery-crm-v1";
  const statusVar = { "Not Contacted": "--s-nc", "Sample Sent": "--s-sample", "Meeting Booked": "--s-meet", "Partner Active": "--s-partner", "Declined": "--s-declined" };
  const statusColor = s => css.getPropertyValue(statusVar[s] || "--s-nc").trim();
  const priShort = p => p.slice(0, 6).replace("Tier ", "T");   // "Tier 1 - Quick…" -> "T1"
  const isQuickWin = r => r.launch_priority.startsWith("Tier 1") && r.single_sku_openness === "High" &&
    r.brand_alignment_score >= 70 && r.pipeline_status !== "Partner Active" && r.pipeline_status !== "Declined";
  let edits = {};
  try { edits = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { edits = {}; }
  const saveEdits = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(edits)); } catch (e) { /* private mode: edits last this session */ } };
  data.forEach(r => Object.assign(r, edits[r.crm_key] || {}));
  const byId = new Map(data.map(r => [r.id, r]));

  // ---- Map
  const map = L.map("map", { zoomControl: true, preferCanvas: true }).setView([49.5, 5.5], 5);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  const legend = L.control({ position: "bottomright" });
  legend.onAdd = () => {
    const d = L.DomUtil.create("div", "legend");
    d.innerHTML = ["Niche Boutique", "Independent Concept Store", "Department Store"]
      .map(t => `<div><span class="dot" style="background:${color(t)}"></span>${t}</div>`).join("") +
      `<div style="color:var(--muted)">Marker size = tier score</div>`;
    return d;
  };
  legend.addTo(map);

  const popup = r => `<div class="pop">
    <h3>${esc(r.name)}</h3>
    <div class="meta">${esc(r.type)} · ${esc(r.district || r.city)}, ${esc(r.country_name)}</div>
    <div>${esc(r.full_address)}</div>
    <div class="meta"><span class="st" style="--c:${statusColor(r.pipeline_status)}">${esc(r.pipeline_status)}</span> · ${esc(r.launch_priority)} · pitch ${esc(r.decision_maker_role)}</div>
    ${r.notes_prospections ? `<div class="meta">“${esc(r.notes_prospections)}”</div>` : ""}
    <div class="scores"><span>Tier <b>${r.tier_score}</b></span><span>Fit <b>${r.brand_alignment_score}</b></span><span>SKU <b>${r.single_sku_openness}</b></span><span>CX <b>${stars(r.customer_experience_rating)}</b></span></div>
    ${r.network ? `<div class="meta">Network: ${esc(r.network)}</div>` : ""}
    <div class="tags">${r.cx_traits.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
    <div style="margin:4px 0 8px">${esc(r.sentiment_summary)}</div>
    <a href="${r.google_maps_url}" target="_blank" rel="noopener">Google Maps</a><a href="${r.instagram_search_url}" target="_blank" rel="noopener">Instagram</a>${
      r.source.startsWith("osm:") ? `<a href="https://www.openstreetmap.org/${r.source.slice(4)}" target="_blank" rel="noopener">OSM</a>` : ""}
  </div>`;

  const markers = new Map();
  const layer = L.layerGroup().addTo(map);
  // Draw small markers last so big ones don't hide them
  // Ring colour = pipeline status once a store has been contacted
  const ring = r => r.pipeline_status === "Not Contacted" ? { color: "#fff", weight: 1.2 } : { color: statusColor(r.pipeline_status), weight: 3 };
  [...data].sort((a, b) => b.tier_score - a.tier_score).forEach(r => {
    const m = L.circleMarker([r.lat, r.lng], {
      radius: radius(r.tier_score), ...ring(r), fillColor: color(r.type), fillOpacity: .85
    }).bindPopup(() => popup(r), { maxWidth: 320 }).bindTooltip(r.name, { direction: "top", offset: [0, -4] });
    m.on("click", () => focusRow(r.id));
    markers.set(r.id, m);
  });

  // ---- Table
  const bar = cell => `<div class="bar" title="${cell.getValue()}"><i style="width:${cell.getValue()}%"></i></div>`;
  const stop = e => e.stopPropagation();   // editing a cell must not fly the map
  const table = new Tabulator("#table", {
    data, index: "id", layout: "fitColumns", height: "100%", selectableRows: false,
    initialSort: [{ column: "tier_score", dir: "desc" }],
    columns: [
      { title: "Name", field: "name", minWidth: 190, widthGrow: 2, formatter: c => `<b>${esc(c.getValue())}</b>` },
      { title: "Priority", field: "launch_priority", width: 80, formatter: c =>
          `<span class="pri t${c.getValue()[5]}" title="${esc(c.getValue())}">${priShort(c.getValue())}</span>` },
      { title: "Status", field: "pipeline_status", width: 140, cssClass: "editable", editor: "list", editorParams: { values: STATUSES },
        sorter: (a, b) => STATUSES.indexOf(a) - STATUSES.indexOf(b), cellClick: stop,
        formatter: c => `<span class="st" style="--c:${statusColor(c.getValue())}">${esc(c.getValue())}</span>` },
      { title: "Decision maker", field: "decision_maker_role", width: 125, cssClass: "editable", editor: "list", editorParams: { values: ROLES }, cellClick: stop },
      { title: "Prospection notes", field: "notes_prospections", minWidth: 200, widthGrow: 2, cssClass: "editable", editor: "textarea", headerSort: false, cellClick: stop,
        formatter: c => c.getValue() ? `<span title="${esc(c.getValue())}">${esc(c.getValue())}</span>` : `<span class="note">Add note…</span>` },
      { title: "Type", field: "type", minWidth: 120, formatter: c =>
          `<span class="typ"><span class="dot" style="background:${color(c.getValue())}"></span>${esc(c.getValue())}</span>` },
      { title: "City", field: "city", minWidth: 100, formatter: c => esc(c.getRow().getData().district || c.getValue()) },
      { title: "Address", field: "full_address", minWidth: 200, widthGrow: 2, formatter: c => esc(c.getValue()) },
      { title: "CC", field: "country", width: 60 },
      { title: "Tier", field: "tier_score", width: 70, hozAlign: "right", sorter: "number" },
      { title: "Fit", field: "brand_alignment_score", width: 110, sorter: "number", formatter: c =>
          `<div style="display:flex;gap:6px;align-items:center"><span style="width:22px;text-align:right">${c.getValue()}</span><div style="flex:1">${bar(c)}</div></div>` },
      { title: "SKU", field: "single_sku_openness", width: 70, sorter: (a, b) => ({ High: 3, Med: 2, Low: 1 }[a] - { High: 3, Med: 2, Low: 1 }[b]) },
      { title: "CX", field: "customer_experience_rating", width: 70, hozAlign: "right", sorter: "number", formatter: c => stars(c.getValue()) },
      { title: "Traits", field: "cx_traits", minWidth: 180, widthGrow: 2, headerSort: false, formatter: c => esc(c.getValue().join(" · ")) },
      { title: "Links", field: "google_maps_url", width: 110, headerSort: false, formatter: c => {
          const r = c.getRow().getData();
          return `<a href="${r.google_maps_url}" target="_blank" rel="noopener">Maps</a> · <a href="${r.instagram_search_url}" target="_blank" rel="noopener">IG</a>`;
        }, cellClick: e => e.stopPropagation() },
    ],
  });

  table.on("cellEdited", cell => {
    const field = cell.getField(), r = byId.get(cell.getRow().getData().id);
    if (!CRM_FIELDS.includes(field)) return;
    r[field] = field === "notes_prospections" ? String(cell.getValue() ?? "").trim() : cell.getValue();
    edits[r.crm_key] = Object.fromEntries(CRM_FIELDS.map(k => [k, r[k]]));
    saveEdits();
    markers.get(r.id).setStyle(ring(r));
    apply();
  });

  let openPending = null;
  table.on("rowClick", (e, row) => {
    const r = row.getData(), m = markers.get(r.id);
    map.off("moveend", openPending);
    openPending = () => m.openPopup();
    map.once("moveend", openPending);
    map.flyTo([r.lat, r.lng], Math.max(map.getZoom(), 14), { duration: .6 });
    highlight(r.id);
  });

  let activeId = null;
  function highlight(id) {
    if (activeId != null) table.getRow(activeId)?.getElement().classList.remove("active");
    activeId = id;
    table.getRow(id)?.getElement().classList.add("active");
  }
  function focusRow(id) {
    table.scrollToRow(id, "center", false).catch(() => {});
    highlight(id);
  }
  table.on("renderComplete", () => activeId != null && table.getRow(activeId)?.getElement().classList.add("active"));

  // ---- Filters
  const $ = id => document.getElementById(id);
  const uniq = k => [...new Set(data.map(r => r[k]))].sort();
  uniq("country").forEach(c => {
    const n = data.filter(r => r.country === c).length;
    $("countries").insertAdjacentHTML("beforeend",
      `<label class="chip" title="${esc(data.find(r => r.country === c).country_name)}"><input type="checkbox" name="cc" value="${c}" checked>${c} <span style="color:var(--muted)">${n}</span></label>`);
  });
  uniq("type").forEach(t => $("type").add(new Option(t, t)));
  STATUSES.forEach(t => $("status").add(new Option(t, t)));
  uniq("launch_priority").forEach(t => $("priority").add(new Option(t, t)));
  // City list follows the selected countries; keeps the current pick when still available
  function fillCities() {
    const ccs = new Set([...document.querySelectorAll("input[name=cc]:checked")].map(i => i.value)), cur = $("city").value;
    const counts = {};
    data.forEach(r => ccs.has(r.country) && (counts[r.city] = (counts[r.city] || 0) + 1));
    $("city").length = 1;
    Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b))
      .forEach(c => $("city").add(new Option(`${c} (${counts[c]})`, c)));
    $("city").value = counts[cur] ? cur : "";
  }
  fillCities();

  function apply() {
    const q = $("q").value.trim().toLowerCase();
    const ccs = new Set([...document.querySelectorAll("input[name=cc]:checked")].map(i => i.value)), ty = $("type").value, city = $("city").value;
    const minT = +$("tier").value, minA = +$("align").value;
    const open = new Set([...document.querySelectorAll("input[name=open]:checked")].map(i => i.value));
    const srcs = new Set([...document.querySelectorAll("input[name=src]:checked")].map(i => i.value));
    const bounds = $("inview").checked ? map.getBounds() : null;
    const st = $("status").value, pri = $("priority").value, quick = $("quick").checked;
    $("tier-v").textContent = minT; $("align-v").textContent = minA;

    // Map shows every match; "Only in view" narrows the table to the visible map area
    const base = data.filter(r =>
      ccs.has(r.country) && (!ty || r.type === ty) && (!city || r.city === city) &&
      r.tier_score >= minT && r.brand_alignment_score >= minA && open.has(r.single_sku_openness) &&
      srcs.has(r.source.startsWith("osm:") ? "osm" : "curated") &&
      (!st || r.pipeline_status === st) && (!pri || r.launch_priority === pri) && (!quick || isQuickWin(r)) &&
      (!q || r._q.includes(q)));
    const keep = bounds ? base.filter(r => bounds.contains([r.lat, r.lng])) : base;
    const ids = new Set(keep.map(r => r.id)), baseIds = new Set(base.map(r => r.id));
    table.setFilter(r => ids.has(r.id));
    markers.forEach((m, id) => baseIds.has(id) ? layer.addLayer(m) : layer.removeLayer(m));

    dashboard(keep);
    return keep;
  }

  function dashboard(rows) {
    const avg = k => rows.length ? Math.round(rows.reduce((s, r) => s + r[k], 0) / rows.length) : null;
    const by = Object.fromEntries(STATUSES.map(s => [s, 0]));
    rows.forEach(r => by[r.pipeline_status]++);
    const active = rows.filter(r => ACTIVE.has(r.pipeline_status)).length;
    const fit = avg("brand_alignment_score"), addr = avg("address_confidence_score");
    $("m-total").innerHTML = `${rows.length}<small> / ${data.length}</small>`;
    $("m-total-h").textContent = `avg fit ${fit ?? "–"} · ${rows.filter(r => r.single_sku_openness === "High").length} open to single-SKU`;
    $("m-high").textContent = rows.filter(r => r.launch_priority.startsWith("Tier 1")).length;
    $("m-high-h").textContent = `Tier 1 indie niche · ${rows.filter(isQuickWin).length} quick wins`;
    const pct = rows.length ? 100 * active / rows.length : 0;
    $("m-pipe").innerHTML = `${active}<small> ${active && pct < 1 ? "<1" : Math.round(pct)}% engaged</small>`;
    $("m-pipe-h").textContent = `${by["Sample Sent"]} samples · ${by["Meeting Booked"]} meetings · ${by["Partner Active"]} partners · ${by["Declined"]} declined`;
    $("m-funnel").innerHTML = rows.length ? STATUSES.filter(s => by[s]).map(s =>
      `<i title="${s}: ${by[s]}" style="flex:${by[s]};background:${statusColor(s)}"></i>`).join("") : "";
    $("m-addr").textContent = addr == null ? "–" : addr + "%";
    $("m-addr-h").textContent = `${rows.filter(r => r.address_source === "curated").length} hand-checked · ${rows.filter(r => r.address_source === "osm_reverse").length} inferred number`;
  }

  // ---- Exports
  function download(name, text, type) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  const CSV_COLS = [
    ["Store", "name"], ["Launch priority", "launch_priority"], ["Pipeline status", "pipeline_status"],
    ["Decision maker", "decision_maker_role"], ["Prospection notes", "notes_prospections"], ["Type", "type"],
    ["Network", "network"], ["City", "city"], ["District", "district"], ["Country", "country_name"], ["Address", "full_address"],
    ["Tier score", "tier_score"], ["Brand fit", "brand_alignment_score"], ["Single-SKU openness", "single_sku_openness"],
    ["Address confidence %", "address_confidence_score"], ["Google Maps", "google_maps_url"], ["Instagram", "instagram_search_url"],
    ["CRM key", "crm_key"],
  ];
  const csvCell = v => {
    const s = v == null ? "" : String(v);
    return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  $("csv").addEventListener("click", () => {
    const rows = table.getData("active").map(r => byId.get(r.id));
    const lines = [CSV_COLS.map(c => c[0]), ...rows.map(r => CSV_COLS.map(c => r[c[1]]))].map(l => l.map(csvCell).join(","));
    // BOM so Excel reads accents (Bongénie, Düsseldorf…) correctly
    download(`outreach-${new Date().toISOString().slice(0, 10)}.csv`, "\ufeff" + lines.join("\r\n"), "text/csv;charset=utf-8");
  });
  $("crm").addEventListener("click", () => {
    const crm = Object.fromEntries(data.map(r => [r.crm_key, Object.fromEntries(CRM_FIELDS.map(k => [k, r[k]]))]));
    download("crm.json", JSON.stringify(crm, null, 1) + "\n", "application/json");
  });
  $("discard").addEventListener("click", () => {
    const n = Object.keys(edits).length;
    if (!n || !confirm(`Discard ${n} pipeline edit(s) stored in this browser? Export CRM JSON first to keep them.`)) return;
    edits = {}; saveEdits();
    location.reload();
  });

  let firstFit = true;
  function applyAndFit() {
    const keep = apply();
    if (keep.length && !$("inview").checked) {
      map.fitBounds(L.latLngBounds(keep.map(r => [r.lat, r.lng])).pad(0.1), { maxZoom: 13, animate: !firstFit });
    }
    firstFit = false;
  }

  $("type").addEventListener("change", applyAndFit);
  $("city").addEventListener("change", applyAndFit);
  ["status", "priority", "quick"].forEach(id => $(id).addEventListener("change", applyAndFit));
  document.querySelectorAll("input[name=cc]").forEach(i => i.addEventListener("change", () => { fillCities(); applyAndFit(); }));
  let qTimer;
  $("q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(apply, 120); });
  ["tier", "align"].forEach(id => $(id).addEventListener("input", apply));
  document.querySelectorAll("input[name=open]").forEach(i => i.addEventListener("change", apply));
  document.querySelectorAll("input[name=src]").forEach(i => i.addEventListener("change", applyAndFit));
  $("inview").addEventListener("change", apply);
  map.on("moveend", () => $("inview").checked && apply());
  $("reset").addEventListener("click", () => {
    $("q").value = ""; $("type").value = "";
    document.querySelectorAll("input[name=cc]").forEach(i => (i.checked = true));
    fillCities(); $("city").value = "";
    $("tier").value = 0; $("align").value = 0; $("inview").checked = false;
    $("status").value = ""; $("priority").value = ""; $("quick").checked = false;
    document.querySelectorAll("input[name=open], input[name=src]").forEach(i => (i.checked = true));
    map.off("moveend", openPending);
    map.closePopup();
    applyAndFit();
  });

  table.on("tableBuilt", applyAndFit);
})();
</script>
</body>
</html>
